name: Sincronizar Omie

# Roda em dias uteis, 13h e 17h15 de Brasilia (16h e 20h15 UTC),
# logo depois das rotinas financeiras das 12h e das 16h15.
# Tambem pode ser disparado a mao pela aba Actions.
on:
  schedule:
    - cron: "0 16 * * 1-5"
    - cron: "15 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-omie
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ler o Omie e gerar data/actuals.json
        env:
          OMIE_APP_KEY: ${{ secrets.OMIE_APP_KEY }}
          OMIE_APP_SECRET: ${{ secrets.OMIE_APP_SECRET }}
        run: python scripts/sync_omie.py

      - name: Conferir que nada sob sigilo nem credencial vazou para o JSON
        run: python scripts/check_leak.py

      - name: Publicar se mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/actuals.json
          if git diff --staged --quiet; then
            echo "sem mudanca, nada a publicar"
          else
            git commit -m "dados: sincronizacao do Omie em $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git push
          fi
